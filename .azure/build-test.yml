# Shared steps: configure, build, unit tests, and end-to-end tests (direct
# and through a local relay). CMAKE_EXTRA is set per job.
steps:
  - bash: |
      set -euo pipefail
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $(CMAKE_EXTRA)
      cmake --build build --config Release --parallel
    displayName: Build

  - bash: ctest --test-dir build -C Release --output-on-failure
    displayName: Unit tests

  - bash: |
      set -euo pipefail
      bin=build; [ "$AGENT_OS" = "Windows_NT" ] && bin=build/Release
      ext=""; [ "$AGENT_OS" = "Windows_NT" ] && ext=".exe"
      tmp="$(Agent.TempDirectory)"
      "$bin/tetherdesk-host$ext" --demo --password ci-password-1 --no-console --no-relay \
          --key-file "$tmp/host_key" --downloads "$tmp/dl" > host.log 2>&1 &
      trap 'echo "--- host log ---"; cat host.log' EXIT
      sleep 3
      "$bin/tetherdesk-probe$ext" localhost --password wrong-password --expect-fail
      "$bin/tetherdesk-probe$ext" localhost --password ci-password-1 --seconds 3 --quality 0 \
          --type "CI says hello" --copy
    displayName: End-to-end test (encrypted session)

  - bash: |
      set -euo pipefail
      bin=build; [ "$AGENT_OS" = "Windows_NT" ] && bin=build/Release
      ext=""; [ "$AGENT_OS" = "Windows_NT" ] && ext=".exe"
      tmp="$(Agent.TempDirectory)"
      mkdir -p "$tmp/relaycfg"
      "$bin/tetherdesk-relay$ext" --port 8089 > relay.log 2>&1 &
      sleep 1
      "$bin/tetherdesk-host$ext" --demo --password ci-password-2 --no-console --port 5993 \
          --relay localhost:8089 --key-file "$tmp/relaycfg/host_key" > host2.log 2>&1 &
      trap 'echo "--- relay log ---"; cat relay.log; echo "--- host log ---"; cat host2.log' EXIT
      sleep 4
      id=$(cut -d' ' -f1 "$tmp/relaycfg/relay_id")
      "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id 999999999 --password x --expect-fail
      "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id "$id" --password ci-password-2 --seconds 3 \
          --type "Hello via relay"
    displayName: End-to-end test (through the relay)
