name: build

# Builds and tests the host, native viewer, probe and web viewer on Windows,
# Linux and macOS. Pushing a tag like v1.0.0 also publishes zips to a GitHub
# release (no workflow artifacts are uploaded, to stay within storage quota).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libx11-dev libxtst-dev

      - name: Configure
        shell: bash
        run: |
          extra=""
          # Windows/macOS release binaries embed SDL (built from source).
          if [ "$RUNNER_OS" != "Linux" ]; then extra="-DTD_STATIC_SDL=ON"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: End-to-end test (demo host + encrypted probe)
        shell: bash
        run: |
          bin=build; [ "$RUNNER_OS" = "Windows" ] && bin=build/Release
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          "$bin/tetherdesk-host$ext" --demo --password ci-password-1 --no-console --no-relay \
              --key-file "$RUNNER_TEMP/host_key" --downloads "$RUNNER_TEMP/dl" > host.log 2>&1 &
          trap 'echo "--- host log ---"; cat host.log' EXIT
          sleep 3
          "$bin/tetherdesk-probe$ext" localhost --password wrong-password --expect-fail
          "$bin/tetherdesk-probe$ext" localhost --password ci-password-1 --seconds 3 --quality 0 \
              --type "CI says hello" --copy

      - name: End-to-end test through the relay (connect by ID)
        shell: bash
        run: |
          bin=build; [ "$RUNNER_OS" = "Windows" ] && bin=build/Release
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/relaycfg"
          "$bin/tetherdesk-relay$ext" --port 8089 > relay.log 2>&1 &
          sleep 1
          "$bin/tetherdesk-host$ext" --demo --password ci-password-2 --no-console --port 5993 \
              --relay localhost:8089 --key-file "$RUNNER_TEMP/relaycfg/host_key" > host2.log 2>&1 &
          trap 'echo "--- relay log ---"; cat relay.log; echo "--- host log ---"; cat host2.log' EXIT
          sleep 4
          id=$(cut -d' ' -f1 "$RUNNER_TEMP/relaycfg/relay_id")
          echo "host ID: $id"
          "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id 999999999 --password x --expect-fail
          "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id "$id" --password ci-password-2 --seconds 3 \
              --type "Hello via relay"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build web viewer
        shell: bash
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel

      - name: Package (macOS .dmg)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        shell: bash
        run: |
          bash ./packaging/macos/make_dmg.sh "${GITHUB_REF_NAME#v}"
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Package (Windows installer)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/web"
          cp build/Release/TetherDesk.exe build/Release/tetherdesk-host.exe build/Release/tetherdesk-probe.exe README.md "$stage/"
          mkdir -p dist
          # QuickSupport: one self-contained .exe that opens straight into sharing.
          cp build/Release/TetherDesk.exe dist/TetherDesk-QuickSupport.exe
          cp build-web/index.html build-web/index.js build-web/index.wasm "$stage/web/"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" -Q "-DAppVersion=${GITHUB_REF_NAME#v}" "-DStageDir=$(cygpath -w "$stage")" \
              "-O$(cygpath -w "$PWD/dist")" packaging/windows/tetherdesk.iss
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Package (Linux .zip)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          out="TetherDesk-${GITHUB_REF_NAME#v}-linux-x64"
          mkdir -p "$out/web"
          cp build/TetherDesk build/tetherdesk-host build/tetherdesk-probe README.md "$out/"
          cp build-web/index.html build-web/index.js build-web/index.wasm "$out/web/"
          # Relay bundle (deployed to the server by relay/deploy-ec2.sh)
          mkdir -p "$out/relay/public"
          cp build/tetherdesk-relay "$out/relay/"
          cp build-web/index.html build-web/index.js build-web/index.wasm relay/get.html "$out/relay/public/"
          zip -qr "$out.zip" "$out"
          echo "ASSET=$out.zip" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          body: |
            **Downloads**
            - macOS 12.3+ (Apple Silicon): `TetherDesk-*-macOS.dmg` - open it and drag TetherDesk to Applications.
              The app isn't notarized yet: the first time, right-click it and choose **Open**.
            - Windows 10/11 (x64): `TetherDesk-Setup-*.exe`. SmartScreen may warn about an unknown
              publisher - choose **More info > Run anyway**.
            - Linux (x64, X11): `TetherDesk-*-linux-x64.zip` (needs libsdl2, libx11, libxtst).

            - **QuickSupport** (`TetherDesk-QuickSupport.exe` / `-macOS.zip`): nothing to install - the person
              who needs help runs it and reads out the ID and password.

            Use **Connect to a PC** (an ID works from anywhere, via the relay) to control another computer, or
            **Share this PC** to let someone connect to yours. Helpers can also connect from any browser at
            https://tetherdesk.54-151-75-113.nip.io/
