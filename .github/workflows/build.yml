name: build

# Builds and tests the host, native viewer, probe, relay and web viewer on
# Windows, Linux and macOS. Every push to main refreshes the single
# "v1.0.0" release: the tag is moved to the new commit and the download files
# are replaced in place (stable names, no new version per change). No
# workflow artifacts are uploaded, to stay within storage quota.
# Builds now run on Azure Pipelines (azure-pipelines.yml); this workflow is
# kept as a manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 3.1.74
  RELEASE_TAG: v1.0.0

jobs:
  prepare:
    # Points the one release at this commit (creating it if it's missing).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Move the release tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f "$RELEASE_TAG"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "TetherDesk" --latest --notes-file .github/release-notes.md
          else
            gh release edit "$RELEASE_TAG" --title "TetherDesk" --latest --notes-file .github/release-notes.md
          fi

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libx11-dev libxtst-dev

      - name: Configure
        shell: bash
        run: |
          extra=""
          # Windows/macOS release binaries embed SDL (built from source).
          if [ "$RUNNER_OS" != "Linux" ]; then extra="-DTD_STATIC_SDL=ON"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: End-to-end test (demo host + encrypted probe)
        shell: bash
        run: |
          bin=build; [ "$RUNNER_OS" = "Windows" ] && bin=build/Release
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          "$bin/tetherdesk-host$ext" --demo --password ci-password-1 --no-console --no-relay \
              --key-file "$RUNNER_TEMP/host_key" --downloads "$RUNNER_TEMP/dl" > host.log 2>&1 &
          trap 'echo "--- host log ---"; cat host.log' EXIT
          sleep 3
          "$bin/tetherdesk-probe$ext" localhost --password wrong-password --expect-fail
          "$bin/tetherdesk-probe$ext" localhost --password ci-password-1 --seconds 3 --quality 0 \
              --type "CI says hello" --copy

      - name: End-to-end test through the relay (connect by ID)
        shell: bash
        run: |
          bin=build; [ "$RUNNER_OS" = "Windows" ] && bin=build/Release
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/relaycfg"
          "$bin/tetherdesk-relay$ext" --port 8089 > relay.log 2>&1 &
          sleep 1
          "$bin/tetherdesk-host$ext" --demo --password ci-password-2 --no-console --port 5993 \
              --relay localhost:8089 --key-file "$RUNNER_TEMP/relaycfg/host_key" > host2.log 2>&1 &
          trap 'echo "--- relay log ---"; cat relay.log; echo "--- host log ---"; cat host2.log' EXIT
          sleep 4
          id=$(cut -d' ' -f1 "$RUNNER_TEMP/relaycfg/relay_id")
          echo "host ID: $id"
          "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id 999999999 --password x --expect-fail
          "$bin/tetherdesk-probe$ext" --relay localhost:8089 --id "$id" --password ci-password-2 --seconds 3 \
              --type "Hello via relay"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build web viewer
        shell: bash
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel

      - name: Package (macOS .dmg)
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        shell: bash
        run: |
          bash ./packaging/macos/make_dmg.sh
          mkdir -p upload
          cp dist/TetherDesk-*-macOS.dmg upload/TetherDesk-macOS.dmg
          cp dist/TetherDesk-QuickSupport-macOS.zip dist/TetherDesk-Remote-macOS.dmg upload/

      - name: Package (Windows installer)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/web"
          cp build/Release/TetherDesk.exe build/Release/tetherdesk-host.exe build/Release/tetherdesk-probe.exe README.md "$stage/"
          mkdir -p dist
          # QuickSupport: the dedicated share-only app (one self-contained .exe).
          cp build/Release/TetherDesk-QuickSupport.exe dist/
          cp build-web/index.html build-web/index.js build-web/index.wasm "$stage/web/"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" -Q "-DAppVersion=1.0.0" "-DStageDir=$(cygpath -w "$stage")" \
              "-O$(cygpath -w "$PWD/dist")" packaging/windows/tetherdesk.iss
          mkdir -p upload
          cp dist/TetherDesk-Setup-*.exe upload/TetherDesk-Setup.exe
          rstage="$RUNNER_TEMP/stage-remote"
          mkdir -p "$rstage/web"
          cp build/Release/TetherDesk-Remote.exe README.md "$rstage/"
          cp build-web/index.html build-web/index.js build-web/index.wasm "$rstage/web/"
          "$iscc" -Q "-DAppVersion=1.0.0" "-DStageDir=$(cygpath -w "$rstage")" \
              "-O$(cygpath -w "$PWD/dist")" packaging/windows/tetherdesk-remote.iss
          cp dist/TetherDesk-Remote-Setup-*.exe upload/TetherDesk-Remote-Setup.exe
          cp dist/TetherDesk-QuickSupport.exe upload/

      - name: Package (Linux .zip)
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        shell: bash
        run: |
          out="TetherDesk-linux-x64"
          mkdir -p "$out/web"
          cp build/TetherDesk build/tetherdesk-host build/tetherdesk-probe README.md "$out/"
          cp build-web/index.html build-web/index.js build-web/index.wasm "$out/web/"
          # Relay bundle (deployed to the server by relay/deploy-ec2.sh):
          # the relay, the website and the web viewer.
          mkdir -p "$out/relay/public/assets"
          cp build/tetherdesk-relay "$out/relay/"
          cp build-web/index.html build-web/index.js build-web/index.wasm "$out/relay/public/"
          cp relay/site/home.html relay/site/get.html "$out/relay/public/"
          cp relay/site/assets/* "$out/relay/public/assets/"
          mkdir -p upload
          zip -qr "upload/$out.zip" "$out"

      - name: Update the release files
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" upload/* --clobber
