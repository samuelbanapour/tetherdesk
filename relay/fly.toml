# Fly.io config for the TetherDesk relay. Deploy with relay/deploy.sh.
# One always-on machine: hosts keep a connection open, and pairing state is
# in memory, so this must not scale to zero or run several machines.
app = "tetherdesk-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
